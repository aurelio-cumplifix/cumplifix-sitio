name: Contenido desde la hoja de Google

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, al minuto 7
  workflow_dispatch:       # botón «Run workflow» para actualizar al momento

permissions:
  contents: write
  pages: write

concurrency:
  group: contenido
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la hoja y actualizar data/*.json
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python .github/scripts/sync_contenido.py

      - name: Guardar y publicar si hubo cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard assets/img/eventos)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "cumplifix-contenido"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/img/eventos
          git commit -m "Contenido actualizado desde la hoja de Google"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "La publicación se hará con el siguiente build de Pages."
